<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HealthDock - Independent Medical Appointment & Practice Software</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Urbanist:wght@200;300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS with custom clinical palette -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {
                teal: '#14B8A6',
                'teal-hover': '#0D9488',
                'teal-subtle': '#F0FDFA',
                'teal-light': '#CCFBF1',
              },
              navy: {
                DEFAULT: '#0B192C',
                dark: '#071224',
                accent: '#132A4A',
                surface: '#1E3E62',
              },
            },
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'sans-serif'],
              display: ['"Outfit"', 'sans-serif'],
              stylish: ['"Urbanist"', '"Outfit"', 'sans-serif'],
              urbanist: ['"Urbanist"', 'sans-serif'],
              serif: ['"Libre Baskerville"', 'serif'],
              baskerville: ['"Libre Baskerville"', 'serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
            }
          }
        }
      }
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-[#090E17] text-slate-800 dark:text-slate-100 min-h-screen antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
